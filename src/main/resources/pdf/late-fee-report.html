<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Multas</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            color: #333333;
            margin: 20px;
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #bdc3c7;
            padding: 8px 12px;
            font-size: 12px;
            text-align: left;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
<!--/*@thymesVar id="lateFees" type="java.util.List<scesi.org.check.latefee.model.projection.ILateFeeReportProjection>"*/-->
<h2>Reporte de Multas Pendientes de Pago</h2>

<table>
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Evento</th>
        <th>Tipo</th>
        <th>Fecha</th>
        <th>Monto (Bs)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="fee : ${lateFees}">
        <td th:text="${fee.name}">Nombre</td>
        <td th:text="${fee.lastName}">Apellido</td>
        <td th:text="${fee.event}">Evento</td>
        <td th:text="${fee.typeAttendance}">Tipo</td>
        <td th:text="${#temporals.format(fee.attendanceDate, 'dd/MM/yyyy HH:mm')}">Fecha</td>
        <td th:text="${fee.amountFee}">0.00</td>
    </tr>
    <tr th:if="${#lists.isEmpty(lateFees)}">
        <td colspan="6" class="text-center">No hay multas pendientes.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
