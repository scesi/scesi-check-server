spring.application.name=check
spring.config.import=file:.env[.properties]

# Db connection

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from = ${MAIL_FROM}

spring.mqtt.broker-url=tcp://${MQTT_HOST}:${MQTT_PORT}
spring.mqtt.client-id=check-server-${random.uuid}
spring.mqtt.username=${MQTT_USER}
spring.mqtt.password=${MQTT_PASS}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cookie Configuration
app.cookie.secure=${COOKIE_SECURE}
app.cookie.domain=${COOKIE_DOMAIN}
app.cookie.path=${COOKIE_PATH}

debug=true