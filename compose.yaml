services:
  postgres:
    image: 'postgres:18.6-alpine3.24'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '${DB_PORT}:${DB_PORT}'
    volumes:
      - './database-pg:/var/lib/postgresql'

  mqtt-broker:
    image: 'eclipse-mosquitto:2.1.2-alpine'
    ports:
      - '1883:1883'
    restart: unless-stopped